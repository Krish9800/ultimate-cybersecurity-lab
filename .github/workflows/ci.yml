name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Type Check, SAST & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Code Formatting & Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Mypy Strict Type Analysis
        run: |
          mypy --strict src tests

      - name: Bandit Security SAST Scan
        run: |
          bandit -r src/

      - name: Pytest with Coverage Gate (>=90%)
        run: |
          pytest --cov=src/cyberlab --cov-report=term-missing --cov-fail-under=90
